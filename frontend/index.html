<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kiragam</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.147/Build/Cesium/Widgets/widgets.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <button id="findBtn" disabled>Find route</button>
    <button id="clearBtn">Clear</button>
    <button id="resetBtn">Reset view</button>
    <button id="demoBtn">Demo route</button>
    <div id="status">Click inside the white box to mark a start point.</div>
    <div id="stats"></div>
  </div>
  <div id="credits"></div>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.147/Build/Cesium/Cesium.js"></script>
  <script src="config.js"></script>
  <script src="main.js"></script>
</body>
</html>
